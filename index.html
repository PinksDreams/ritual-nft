<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ritual NFT Cards</title>

<script src="https://cdn.jsdelivr.net/npm/ethers@6.9.0/dist/ethers.min.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial,sans-serif;
background:#05120b;
color:white;
min-height:100vh;
}

.hero{
padding:60px 20px;
text-align:center;
}

.hero h1{
font-size:52px;
color:#4ade80;
margin-bottom:15px;
}

.hero p{
color:#9ca3af;
font-size:18px;
}

.container{
max-width:1300px;
margin:auto;
padding:20px;
}

.grid{
display:grid;
grid-template-columns:420px 1fr;
gap:40px;
}

.panel{
background:rgba(255,255,255,0.04);
border:1px solid rgba(74,222,128,.15);
border-radius:24px;
padding:30px;
backdrop-filter:blur(12px);
}

.panel h2{
margin-bottom:20px;
color:#4ade80;
}

input{
width:100%;
padding:14px;
border:none;
border-radius:12px;
background:#102117;
color:white;
font-size:16px;
}

button{
width:100%;
padding:14px;
margin-top:20px;
border:none;
border-radius:12px;
cursor:pointer;
font-size:16px;
font-weight:bold;
}

.generate-btn{background:#22c55e;color:white;}
.download-btn{background:#166534;color:white;}

.preview{
display:flex;
justify-content:center;
align-items:center;
}

canvas{
width:100%;
max-width:550px;
border-radius:20px;
box-shadow:0 0 30px rgba(34,197,94,.3);
}

.avatar-preview img{
width:100px;
height:100px;
border-radius:50%;
border:3px solid #22c55e;
display:none;
}

.mint-box{
margin-top:40px;
background:rgba(255,255,255,0.04);
border:1px solid rgba(74,222,128,.15);
border-radius:24px;
padding:30px;
text-align:center;
}

.footer{
margin-top:60px;
padding:30px;
text-align:center;
color:#6b7280;
}

</style>
</head>

<body>

<section class="hero">
<h1>🧬 Ritual NFT Cards</h1>
<p>Create your Ritual NFT and mint it on-chain</p>
</section>

<div class="container">

<div class="grid">

<div class="panel">

<h2>Create Card</h2>

<input id="username" placeholder="@username">

<button class="generate-btn" onclick="generateCard()">Generate Card</button>
<button class="download-btn" onclick="downloadCard()">Download PNG</button>

</div>

<div class="panel preview">
<canvas id="cardCanvas" width="800" height="1000"></canvas>
</div>

</div>

<div class="mint-box">

<h2 style="color:#4ade80;">Mint NFT</h2>

<button class="generate-btn" onclick="connectWallet()">Connect Wallet</button>

<div id="walletAddress" style="margin-top:15px;color:#4ade80;"></div>

<button class="download-btn" id="mintBtn" onclick="mintNFT()" disabled>
Mint NFT
</button>

</div>

</div>

<div class="footer">
Ritual Genesis Collection
</div>

<script>

const contractAddress = "0xdB8FF15f6D9c7a35F86542a9052608DF7a16FB8a";

const contractABI = [
"function mint(address to, string tokenURI)"
];

let currentUser = "ritual";

const canvas = document.getElementById("cardCanvas");
const ctx = canvas.getContext("2d");

function generateCard(){

const username = document.getElementById("username").value.replace("@","").trim();
if(!username){ alert("Enter username"); return; }

currentUser = username;

ctx.clearRect(0,0,800,1000);

const g = ctx.createLinearGradient(0,0,800,1000);
g.addColorStop(0,"#06120d");
g.addColorStop(1,"#0f2d18");

ctx.fillStyle = g;
ctx.fillRect(0,0,800,1000);

ctx.strokeStyle="#22c55e";
ctx.lineWidth=8;
ctx.strokeRect(25,25,750,950);

ctx.fillStyle="#4ade80";
ctx.font="bold 50px Arial";
ctx.textAlign="center";
ctx.fillText("RITUAL CARD",400,90);

ctx.fillStyle="white";
ctx.font="bold 42px Arial";
ctx.fillText("@"+username,400,530);

ctx.fillStyle="#9ca3af";
ctx.font="26px Arial";
ctx.fillText("Genesis Collection",400,580);

ctx.fillStyle="#4ade80";
ctx.font="24px Arial";
ctx.fillText("Ritual Explorer",400,650);

}

function downloadCard(){
const a=document.createElement("a");
a.download=currentUser+"-ritual.png";
a.href=canvas.toDataURL();
a.click();
}

async function connectWallet(){

if(!window.ethereum){
alert("Install MetaMask");
return;
}

const accounts = await ethereum.request({method:"eth_requestAccounts"});
const address = accounts[0];

document.getElementById("walletAddress").innerText =
"Connected: " + address;

document.getElementById("mintBtn").disabled = false;

}

async function mintNFT(){

try{

const provider = new ethers.BrowserProvider(window.ethereum);
const signer = await provider.getSigner();

const contract = new ethers.Contract(
contractAddress,
contractABI,
signer
);

const address = await signer.getAddress();

// временный tokenURI (позже заменим на IPFS)
const metadata = {
name: "Ritual NFT Card",
description: "Generated Ritual Card",
image: canvas.toDataURL("image/png")
};

const tokenURI =
"data:application/json," +
encodeURIComponent(JSON.stringify(metadata));

const tx = await contract.mint(address, tokenURI);

alert("Minting NFT...");
await tx.wait();

alert("NFT minted successfully!");

}catch(e){
console.error(e);
alert("Mint failed");
}

}

generateCard();

</script>

</body>
</html>
