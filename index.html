```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pinkdreams Ritual NFT Cards</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial,sans-serif;
background:#05120b;
color:white;
min-height:100vh;
}

.hero{
padding:60px 20px;
text-align:center;
}

.hero h1{
font-size:52px;
color:#4ade80;
margin-bottom:15px;
}

.hero p{
color:#9ca3af;
font-size:18px;
}

.container{
max-width:1300px;
margin:auto;
padding:20px;
}

.grid{
display:grid;
grid-template-columns:420px 1fr;
gap:40px;
}

.panel{
background:rgba(255,255,255,0.04);
border:1px solid rgba(74,222,128,.15);
border-radius:24px;
padding:30px;
}

.panel h2{
margin-bottom:20px;

}

label{
display:block;
margin-top:20px;

}

input{

}

select{

border:none;
border-radius:12px;
background:#102117;
color:white;

}

button{
width:100%;
padding:14px;
margin-top:20px;
border:none;
border-radius:12px;
cursor:pointer;
font-size:16px;

}

.generate-btn{

color:white;
}

.download-btn{
background:#166534;

}

canvas{
width:100%;

box-shadow:
0 0 30px rgba(34,197,94,.3),
0 0 80px rgba(34,197,94,.15);
}

.preview{
display:flex;
justify-content:center;
align-items:center;
}

.mint-box{
margin-top:40px;
background:rgba(255,255,255,0.04);

}

.mint-box h3{
color:#4ade80;

}

}

</style>
</head>

<body>

<section class="hero">

<h1>🧬 Pinkdreams Ritual NFT Cards</h1>

<p>
Create your Ritual identity card and prepare it for minting.
</p>

</section>

<div class="container">

<div class="grid">

<div class="panel">

<h2>Create Card</h2>

<label>X Username</label>
<input id="username" placeholder="elonmusk">

<label>Style</label>

<select id="style">
<option value="green">Genesis Green</option>
</select>

<button class="generate-btn" onclick="generateCard()">
Generate Card
</button>

<button class="download-btn" onclick="downloadCard()">
Download PNG
</button>

</div>

<div class="panel preview">

<canvas id="cardCanvas" width="800" height="1000"></canvas>

</div>

</div>

<div class="mint-box">

<h3>Mint NFT</h3>

<p style="color:#9ca3af;margin-bottom:20px;">
Mint integration for Ritual testnet will be added next.
</p>

<button class="mint-btn">
Coming Soon
</button>

</div>

</div>

<div class="footer">
Pinkdreams Ritual Genesis Collection
</div>

<script>

const canvas = document.getElementById("cardCanvas");
const ctx = canvas.getContext("2d");

let currentUser = "ritual";

function loadImage(src){
return new Promise((resolve,reject)=>{
const img = new Image();
img.crossOrigin = "anonymous";
img.onload = ()=>resolve(img);
img.onerror = reject;
img.src = src;
});
}

async function generateCard(){

const username =
document.getElementById("username").value.trim();

if(!username){
alert("Enter username");
return;
}

currentUser = username;

ctx.clearRect(0,0,800,1000);

const gradient =
ctx.createLinearGradient(0,0,800,1000);

gradient.addColorStop(0,"#06120d");
gradient.addColorStop(1,"#0f2d18");

ctx.fillStyle = gradient;
ctx.fillRect(0,0,800,1000);

ctx.strokeStyle="#22c55e";
ctx.lineWidth=8;
ctx.strokeRect(25,25,750,950);

ctx.fillStyle="#4ade80";
ctx.font="bold 50px Arial";
ctx.textAlign="center";
ctx.fillText("RITUAL CARD",400,90);

try{

const avatar =
await loadImage(
`https://unavatar.io/twitter/${username}`
);

ctx.save();

ctx.beginPath();
ctx.arc(400,300,130,0,Math.PI*2);
ctx.clip();

ctx.drawImage(
avatar,
270,
170,
260,
260
);

ctx.restore();

}catch(e){

ctx.fillStyle="#374151";
ctx.beginPath();
ctx.arc(400,300,130,0,Math.PI*2);
ctx.fill();

}

ctx.strokeStyle="#4ade80";
ctx.lineWidth=6;

ctx.beginPath();
ctx.arc(400,300,130,0,Math.PI*2);
ctx.stroke();

ctx.fillStyle="white";
ctx.font="bold 42px Arial";
ctx.fillText("@"+username,400,530);

ctx.fillStyle="#9ca3af";
ctx.font="26px Arial";
ctx.fillText("Genesis Collection",400,580);

ctx.fillStyle="#4ade80";
ctx.font="24px Arial";
ctx.fillText("Ritual Explorer",400,650);

ctx.strokeStyle="rgba(74,222,128,.4)";
ctx.strokeRect(150,720,500,120);

ctx.fillStyle="#4ade80";
ctx.font="22px Arial";
ctx.fillText("Status: Active",400,790);

ctx.fillStyle="#9ca3af";
ctx.fillText("Mint ID: Pending",400,830);

}

function downloadCard(){

const link =
document.createElement("a");

link.download =
currentUser + "-ritual-card.png";

link.href =
canvas.toDataURL("image/png");

link.click();

}

generateCard();

</script>

</body>
</html>
