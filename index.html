<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ritual NFT Cards</title>

<script src="https://cdn.jsdelivr.net/npm/ethers@6.13.2/dist/ethers.umd.min.js"></script>

<style>
body{
margin:0;
font-family:Arial;
background:#06130c;
color:white;
text-align:center;
}
.title{
margin-top:30px;
color:#b6ff5c;
font-size:56px;
font-weight:900;

text-shadow:
0 0 8px #b6ff5c,
0 0 16px #b6ff5c,
0 0 32px #7CFF3A,
0 0 64px #7CFF3A,
0 0 100px #39ff14;
}
.logo{
position: fixed;
top: 20px;
right: 20px;
width: 320px;
height: 320px;
object-fit: contain;
z-index: 9999;
filter: drop-shadow(0 0 25px rgba(34,197,94,0.8));
}
input,button{
padding:12px;
margin:10px;
border-radius:10px;
border:none;
font-size:16px;
}

button{cursor:pointer}

.green{background:#22c55e;color:white;}
.dark{background:#14532d;color:white;}

.card-wrapper{
  display: flex;
  justify-content: center;
  margin-top: 20px;
}

/* NFT CARD STYLE */
canvas{
  border-radius: 24px;

  border: 2px solid rgba(182,255,92,0.7);

  box-shadow:
    0 0 10px rgba(182,255,92,0.4),
    0 0 25px rgba(124,255,58,0.3),
    0 0 60px rgba(57,255,20,0.2);

  background: #000;
}
</style>
  
</head>

<body>

<img src="logo.png" class="logo">
   
<h1 class="title">Ritual NFT Cards</h1>

<input id="username" placeholder="@username">

<br>

<button class="green" onclick="generateCard()">Generate</button>
<button class="dark" onclick="downloadCard()">Download PNG</button>

<br>

<div class="card-wrapper">
  <canvas id="card" width="600" height="750"></canvas>
</div>
<br>

<button class="green" onclick="connectWallet()">Connect Wallet</button>
<button class="dark" onclick="mintNFT()">Mint NFT</button>

<div id="wallet"></div>

<h2 style="color:#b6ff5c;">
NFT Collection
</h2>

<div id="supply"
style="
margin-top:20px;
font-size:24px;
font-weight:bold;
color:#b6ff5c;
">
Loading supply...
</div>

<div id="gallery"
style="
display:grid;
grid-template-columns:repeat(auto-fill,180px);
gap:15px;
justify-content:center;
margin-top:30px;
padding-bottom:50px;
">
</div>
<script>

/* =========================
   CONTRACT
========================= */

const contractAddress = "0x280834daDF2f6406F86F91d415B418931aFA6AD9";

const contractABI = [
  "function mint(address to, string tokenURI)",
  "function tokenId() view returns (uint256)",
  "function tokenURI(uint256) view returns (string)"
];

/* =========================
   STABLE AVATAR (NO TWITTER)
========================= */

function getAvatar(username){
  return `https://api.dicebear.com/7.x/identicon/svg?seed=${encodeURIComponent(username)}`;
}

/* =========================
   CANVAS
========================= */

const canvas = document.getElementById("card");
const ctx = canvas.getContext("2d");

let currentUser = "ritual";

/* =========================
   GENERATE CARD
========================= */

if (!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
    this.beginPath();
    this.moveTo(x + r, y);
    this.arcTo(x + w, y, x + w, y + h, r);
    this.arcTo(x + w, y + h, x, y + h, r);
    this.arcTo(x, y + h, x, y, r);
    this.arcTo(x, y, x + w, y, r);
    this.closePath();
    return this;
  };
}
  async function generateCard(){

const username =
document.getElementById("username")
.value
.replace("@","")
.trim() || "ritual";

currentUser = username;

/* HASH */
let hash = 0;

for(let i=0;i<username.length;i++){
hash =
username.charCodeAt(i) +
((hash << 5) - hash);
}

hash = Math.abs(hash);

const avatarIndex = (hash % 18) + 1;
const bgIndex = (Math.floor(hash / 18) % 9) + 1;

const bgUrl =
`https://pinksdreams.github.io/ritual-nft/bg/bg${bgIndex}.png`;

const avatarUrl =
`https://pinksdreams.github.io/ritual-nft/avatars/avatar${avatarIndex}.png`;

ctx.clearRect(0,0,600,750);

/* BACKGROUND */
const bgImg = new Image();
bgImg.crossOrigin = "anonymous";

bgImg.onload = () => {

  ctx.drawImage(bgImg, 0, 0, 600, 750);

  // overlay for contrast
  const gradient = ctx.createLinearGradient(0,0,0,750);
  gradient.addColorStop(0, "rgba(0,0,0,0.25)");
  gradient.addColorStop(1, "rgba(0,0,0,0.75)");

  ctx.fillStyle = gradient;
  ctx.fillRect(0,0,600,750);

  const avatarImg = new Image();
  avatarImg.crossOrigin = "anonymous";

  avatarImg.onload = () => {

    /* ===== AVATAR (LARGER + BETTER FOCUS) ===== */

    const size = 420; // 🔥 увеличили (было ~340)
    const x = (600 - size) / 2;
    const y = 60; // чуть выше для баланса

    // glow behind avatar
    ctx.beginPath();
    ctx.arc(300, 240, 210, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(182,255,92,0.18)";
    ctx.fill();

    ctx.beginPath();
    ctx.arc(300, 240, 160, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(182,255,92,0.10)";
    ctx.fill();

    // avatar
    ctx.drawImage(avatarImg, x, y, size, size);

    /* ===== GLASS PANEL ===== */

    ctx.fillStyle = "rgba(0,0,0,0.45)";
    ctx.beginPath();
    ctx.roundRect(40, 520, 520, 190, 24);
    ctx.fill();

    ctx.strokeStyle = "rgba(182,255,92,0.6)";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.roundRect(40, 520, 520, 190, 24);
    ctx.stroke();

    /* ===== TEXT ===== */

    ctx.textAlign = "center";

    // username
    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 38px Arial";
    ctx.fillText("@" + username, 300, 600);

    // collection name
    ctx.fillStyle = "#b6ff5c";
    ctx.font = "20px Arial";
    ctx.fillText("RITUAL GENESIS COLLECTION", 300, 645);

    // ❌ RANK УДАЛЁН

  };

  avatarImg.src = avatarUrl;
};

bgImg.src = bgUrl;

}
/* =========================
   DOWNLOAD
========================= */

function downloadCard(){
const a=document.createElement("a");
a.download=currentUser+"-nft.png";
a.href=canvas.toDataURL("image/png");
a.click();
}

/* =========================
   CONNECT WALLET
========================= */

async function connectWallet(){

if(!window.ethereum){
alert("MetaMask not found");
return;
}

const accounts = await ethereum.request({
method:"eth_requestAccounts"
});

document.getElementById("wallet").innerText =
"Connected: " + accounts[0];
}

/* =========================
   MINT (DEBUG VERSION)
========================= */

async function mintNFT() {

  try {

    if (!window.ethereum) {
      alert("MetaMask not found");
      return;
    }

    console.log("STEP 1: connect wallet");

    await ethereum.request({
      method: "eth_requestAccounts"
    });

    const chainId = await ethereum.request({
      method: "eth_chainId"
    });

    console.log("Chain:", chainId);

    if (chainId !== "0x7bb") {
      alert("Wrong network! Switch to Ritual testnet");
      return;
    }

    console.log("STEP 2: setup signer");

    const provider = new ethers.BrowserProvider(window.ethereum);
    const signer = await provider.getSigner();

    const contract = new ethers.Contract(
      contractAddress,
      contractABI,
      signer
    );

    const address = await signer.getAddress();

    console.log("STEP 3: build metadata");

    // 👉 стабильный выбор аватара (18 штук)
    const hash = Math.abs(
      currentUser
        .split("")
        .reduce((a, c) => a + c.charCodeAt(0), 0)
    );

    const avatarIndex = (hash % 18) + 1;

    const imageUrl =
      `https://pinksdreams.github.io/ritual-nft/avatars/avatar${avatarIndex}.png`;

    const metadata = {
  name: "Ritual NFT @" + currentUser,
  description: "Ritual NFT Card",
  username: currentUser
};

    const tokenURI =
      "data:application/json;base64," +
      btoa(JSON.stringify(metadata));

    console.log("TOKENURI LENGTH:", tokenURI.length);

    console.log("STEP 4: sending tx");

    const tx = await contract.mint(
      address,
      tokenURI,
      {
        gasLimit: 700000
      }
    );

    console.log("TX HASH:", tx.hash);

    alert("Transaction sent!\n\n" + tx.hash);

    const receipt = await tx.wait();

    console.log("RECEIPT:", receipt);

    alert("Mint SUCCESS!");
await loadSupply();
await loadGallery();
  } catch (e) {

    console.error("MINT ERROR:", e);

    alert(e?.message || "Mint failed");

  }

}
  async function loadSupply() {

  try {

    const provider =
      new ethers.BrowserProvider(window.ethereum);

    const contract =
      new ethers.Contract(
        contractAddress,
        contractABI,
        provider
      );

    const total =
      await contract.tokenId();

    document.getElementById("supply").innerText =
      "Total NFTs Minted: " + total;

  } catch(e) {

    console.error(e);

    document.getElementById("supply").innerText =
      "Cannot load supply";

  }

}
  function getCardAssets(username){

  let hash = 0;

  for(let i=0;i<username.length;i++){
    hash =
      username.charCodeAt(i) +
      ((hash << 5) - hash);
  }

  hash = Math.abs(hash);

  const avatarIndex =
    (hash % 18) + 1;

  const bgIndex =
    (Math.floor(hash / 18) % 9) + 1;

  return {
    avatar:
      `https://pinksdreams.github.io/ritual-nft/avatars/avatar${avatarIndex}.png`,
    bg:
      `https://pinksdreams.github.io/ritual-nft/bg/bg${bgIndex}.png`
  };

}
  async function loadGallery() {

  try {

    const provider =
      new ethers.BrowserProvider(window.ethereum);

    const contract =
      new ethers.Contract(
        contractAddress,
        contractABI,
        provider
      );

    const total =
      Number(await contract.tokenId());

    const gallery =
      document.getElementById("gallery");

    gallery.innerHTML = "";
    
const shownNames = new Set();
    
    for(let i=1;i<=total;i++){

      try{

        const uri =
          await contract.tokenURI(i);

        if(
          !uri.startsWith(
            "data:application/json;base64,"
          )
        ){
          continue;
        }

        const metadata =
          JSON.parse(
            atob(
              uri.split(",")[1]
            )
          );

const nftName =
  metadata.name || ("NFT #" + i);
        const username =
  metadata.username ||
  nftName.replace(
    "Ritual NFT @",
    ""
  );

const assets =
  getCardAssets(username);

const imageUrl =
  assets.avatar;

if (shownNames.has(nftName)) {
  continue;
}

shownNames.add(nftName);
        

        const card =
          document.createElement("div");

        card.style.cursor = "pointer";

card.onclick = () => {

  alert(
    "NFT #" + i +
    "\n" +
    (metadata.name || "")
  );

}; 
        card.style.background =
          "#0d1f14";

        card.style.border =
          "1px solid #4ade80";

        card.style.borderRadius =
          "16px";

        card.style.padding =
          "10px";

        card.style.boxShadow =
          "0 0 15px rgba(74,222,128,.25)";

        const img =
          document.createElement("img");

        img.src =
  imageUrl;

        img.style.width =
          "160px";

        img.style.height =
          "160px";

        img.style.objectFit =
          "cover";

        img.style.borderRadius =
          "12px";

        const name =
          document.createElement("div");

const id =
  document.createElement("div");

id.innerText =
  "#" + i;

id.style.color =
  "#4ade80";

id.style.marginTop =
  "6px";
        
        name.innerText =
          metadata.name || ("NFT #" + i);

        name.style.marginTop =
          "8px";

        name.style.color =
          "#b6ff5c";

        card.appendChild(img);
        card.appendChild(name);

        card.appendChild(id);
        gallery.appendChild(card);

      }catch(err){

        console.log(
          "NFT",
          i,
          "error",
          err
        );

      }

    }

  } catch(e) {

    console.error(
      "Gallery error",
      e
    );

  }

}
/* =========================
   INIT
========================= */

generateCard();

setTimeout(() => {

  loadSupply();
  loadGallery();

}, 1000);

</script>

</body>
</html>
