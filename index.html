<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ritual NFT Cards</title>

<script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>

<style>
body{
margin:0;
font-family:Arial;
background:#06130c;
color:white;
text-align:center;
}

input,button{
padding:12px;
margin:10px;
border-radius:10px;
border:none;
font-size:16px;
}

button{cursor:pointer}

.green{background:#22c55e;color:white;}
.dark{background:#14532d;color:white;}

canvas{
margin-top:20px;
border-radius:20px;
box-shadow:0 0 30px rgba(34,197,94,.3);
}
</style>
</head>

<body>

<h1>🧬 Ritual NFT Cards</h1>

<input id="username" placeholder="@username">

<br>

<button class="green" onclick="generateCard()">Generate</button>
<button class="dark" onclick="downloadCard()">Download PNG</button>

<br>

<canvas id="card" width="800" height="1000"></canvas>

<br>

<button class="green" onclick="connectWallet()">Connect Wallet</button>
<button class="dark" onclick="mintNFT()">Mint NFT</button>

<div id="wallet"></div>

<script>

/* =========================
   CONTRACT
========================= */

const contractAddress = "0x280834daDF2f6406F86F91d415B418931aFA6AD9";

const contractABI = [
  "function mint(address to, string tokenURI)"
];

/* =========================
   STABLE AVATAR (NO TWITTER)
========================= */

function getAvatar(username){
  return `https://api.dicebear.com/7.x/identicon/svg?seed=${encodeURIComponent(username)}`;
}

/* =========================
   CANVAS
========================= */

const canvas = document.getElementById("card");
const ctx = canvas.getContext("2d");

let currentUser = "ritual";

/* =========================
   GENERATE CARD
========================= */

function generateCard(){

const name = document.getElementById("username").value || "unknown";
currentUser = name;

ctx.clearRect(0,0,800,1000);

/* background */
const g = ctx.createLinearGradient(0,0,800,1000);
g.addColorStop(0,"#06120d");
g.addColorStop(1,"#0f2d18");

ctx.fillStyle = g;
ctx.fillRect(0,0,800,1000);

/* frame */
ctx.strokeStyle="#22c55e";
ctx.lineWidth=10;
ctx.strokeRect(20,20,760,960);

/* title */
ctx.fillStyle="#4ade80";
ctx.font="bold 50px Arial";
ctx.textAlign="center";
ctx.fillText("RITUAL NFT",400,120);

/* avatar */
const img = new Image();
img.crossOrigin = "anonymous";
img.src = getAvatar(name);

img.onload = () => {

ctx.save();
ctx.beginPath();
ctx.arc(400,300,130,0,Math.PI*2);
ctx.clip();

ctx.drawImage(img,270,170,260,260);

ctx.restore();

/* text */
ctx.fillStyle="white";
ctx.font="40px Arial";
ctx.fillText("@"+name,400,520);

ctx.fillStyle="#9ca3af";
ctx.font="24px Arial";
ctx.fillText("Genesis Ritual Card",400,580);

};

}

/* =========================
   DOWNLOAD
========================= */

function downloadCard(){
const a=document.createElement("a");
a.download=currentUser+"-nft.png";
a.href=canvas.toDataURL("image/png");
a.click();
}

/* =========================
   CONNECT WALLET
========================= */

async function connectWallet(){

if(!window.ethereum){
alert("MetaMask not found");
return;
}

const accounts = await ethereum.request({
method:"eth_requestAccounts"
});

document.getElementById("wallet").innerText =
"Connected: " + accounts[0];
}

/* =========================
   MINT (SAFE VERSION)
========================= */

async function mintNFT(){

try{

if(!window.ethereum){
alert("MetaMask not found");
return;
}

await ethereum.request({ method:"eth_requestAccounts" });

const provider = new ethers.providers.Web3Provider(window.ethereum);
const signer = provider.getSigner();

const contract = new ethers.Contract(
contractAddress,
contractABI,
signer
);

const address = await signer.getAddress();

const image = canvas.toDataURL("image/png");

const metadata = {
name: "Ritual NFT @"+currentUser,
description: "Ritual NFT Card",
image: image
};

const tokenURI =
"data:application/json;base64," +
btoa(JSON.stringify(metadata));

console.log("Minting...");

let tx;

// ⚠️ иногда estimateGas ломает RPC → bypass
try {
  tx = await contract.mint(address, tokenURI, {
    gasLimit: 500000
  });
} catch (gasError) {
  console.log("Gas fallback triggered");
  tx = await contract.mint(address, tokenURI);
}

await tx.wait();

alert("Mint SUCCESS!");

}catch(e){
console.error(e);
alert("Mint failed — check console");
}

}

/* =========================
   INIT
========================= */

generateCard();

</script>

</body>
</html>
