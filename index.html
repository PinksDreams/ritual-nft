<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ritual NFT Cards</title>

<script src="https://cdn.jsdelivr.net/npm/ethers@6.9.0/dist/ethers.min.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
font-family:Arial,sans-serif;
background:#05120b;
color:white;
min-height:100vh;
}

.hero{
padding:60px 20px;
text-align:center;
}

.hero h1{font-size:52px;color:#4ade80;}
.hero p{color:#9ca3af;}

.container{max-width:1300px;margin:auto;padding:20px;}

.grid{
display:grid;
grid-template-columns:420px 1fr;
gap:40px;
}

.panel{
background:rgba(255,255,255,0.04);
border:1px solid rgba(74,222,128,.15);
border-radius:24px;
padding:30px;
}

input{
width:100%;
padding:14px;
border:none;
border-radius:12px;
background:#102117;
color:white;
}

button{
width:100%;
padding:14px;
margin-top:20px;
border:none;
border-radius:12px;
cursor:pointer;
font-weight:bold;
}

.generate-btn{background:#22c55e;color:white;}
.download-btn{background:#166534;color:white;}

canvas{
width:100%;
max-width:550px;
border-radius:20px;
box-shadow:0 0 30px rgba(34,197,94,.3);
}

.avatar-preview img{
width:100px;
height:100px;
border-radius:50%;
border:3px solid #22c55e;
display:none;
margin-top:10px;
}

.mint-box{
margin-top:40px;
padding:30px;
border:1px solid rgba(74,222,128,.15);
border-radius:24px;
text-align:center;
}

.footer{
margin-top:60px;
text-align:center;
color:#6b7280;
}
</style>
</head>

<body>

<div class="hero">
<h1>🧬 Ritual NFT Cards</h1>
<p>Create and mint your NFT</p>
</div>

<div class="container">

<div class="grid">

<div class="panel">

<h2>Create Card</h2>

<input id="username" placeholder="@username">

<div class="avatar-preview">
<img id="avatarPreview">
</div>

<button class="generate-btn" onclick="generateCard()">Generate Card</button>
<button class="download-btn" onclick="downloadCard()">Download PNG</button>

</div>

<div class="panel">
<canvas id="cardCanvas" width="800" height="1000"></canvas>
</div>

</div>

<div class="mint-box">

<h2 style="color:#4ade80;">Mint NFT</h2>

<button class="generate-btn" onclick="connectWallet()">Connect Wallet</button>

<div id="walletAddress" style="color:#4ade80;margin-top:10px;"></div>

<button class="download-btn" id="mintBtn" onclick="mintNFT()" disabled>
Mint NFT
</button>

</div>

</div>

<div class="footer">
Ritual Genesis Collection
</div>

<script>

/* 🔑 KEY HERE */
const NFT_STORAGE_KEY = "ВСТАВЬ_СЮДА_КЛЮЧ";

const contractAddress = "0xdB8FF15f6D9c7a35F86542a9052608DF7a16FB8a";

const contractABI = [
"function mint(address to, string tokenURI)"
];

let currentUser = "ritual";

const canvas = document.getElementById("cardCanvas");
const ctx = canvas.getContext("2d");

/* ===================== */
/* AVATAR FIX (X SAFE)   */
/* ===================== */

document.getElementById("username").addEventListener("input", function(){

const username = this.value.replace("@","").trim();
const img = document.getElementById("avatarPreview");

if(!username){
img.style.display = "none";
return;
}

img.src = `https://unavatar.io/x/${username}`;
img.style.display = "block";

});

/* fallback avatar for canvas */
async function drawAvatar(username){

try{

const img = new Image();
img.crossOrigin = "anonymous";
img.src = `https://unavatar.io/x/${username}`;

await new Promise((res,rej)=>{
img.onload = res;
img.onerror = rej;
});

ctx.save();
ctx.beginPath();
ctx.arc(400,300,130,0,Math.PI*2);
ctx.clip();
ctx.drawImage(img,270,170,260,260);
ctx.restore();

}catch(e){

ctx.fillStyle="#374151";
ctx.beginPath();
ctx.arc(400,300,130,0,Math.PI*2);
ctx.fill();

}

}

/* ===================== */

function generateCard(){

const username = document.getElementById("username").value.replace("@","").trim();
if(!username){ alert("Enter username"); return; }

currentUser = username;

ctx.clearRect(0,0,800,1000);

const g = ctx.createLinearGradient(0,0,800,1000);
g.addColorStop(0,"#06120d");
g.addColorStop(1,"#0f2d18");

ctx.fillStyle = g;
ctx.fillRect(0,0,800,1000);

ctx.strokeStyle="#22c55e";
ctx.lineWidth=8;
ctx.strokeRect(25,25,750,950);

ctx.fillStyle="#4ade80";
ctx.font="bold 50px Arial";
ctx.textAlign="center";
ctx.fillText("RITUAL CARD",400,90);

ctx.fillStyle="white";
ctx.font="bold 42px Arial";
ctx.fillText("@"+username,400,530);

ctx.fillStyle="#9ca3af";
ctx.font="26px Arial";
ctx.fillText("Genesis Collection",400,580);

ctx.fillStyle="#4ade80";
ctx.font="24px Arial";
ctx.fillText("Ritual Explorer",400,650);

/* avatar */
drawAvatar(username);

}

function downloadCard(){
const a=document.createElement("a");
a.download=currentUser+"-ritual.png";
a.href=canvas.toDataURL();
a.click();
}

async function connectWallet(){

if(!window.ethereum){
alert("Install MetaMask");
return;
}

const accounts = await ethereum.request({method:"eth_requestAccounts"});
const address = accounts[0];

document.getElementById("walletAddress").innerText =
"Connected: " + address;

document.getElementById("mintBtn").disabled = false;
}

/* ===================== */
/* IPFS SAFE */
/* ===================== */

function canvasToBlob(){
return new Promise(res=>{
canvas.toBlob(res,"image/png");
});
}

async function uploadToIPFS(blob){

const res = await fetch("https://api.nft.storage/upload", {
method:"POST",
headers:{
Authorization:`Bearer ${NFT_STORAGE_KEY}`
},
body:blob
});

const data = await res.json();

if(!res.ok || !data.ok){
throw new Error("IPFS failed");
}

return {
cid:data.value.cid,
url:`https://ipfs.io/ipfs/${data.value.cid}`
};
}

/* ===================== */
/* MINT */
/* ===================== */

async function mintNFT(){

try{

if(!window.ethereum){
alert("MetaMask required");
return;
}

const provider = new ethers.BrowserProvider(window.ethereum);
const signer = await provider.getSigner();

const contract = new ethers.Contract(
contractAddress,
contractABI,
signer
);

const address = await signer.getAddress();

alert("Uploading image...");

const imgBlob = await canvasToBlob();
const imageData = await uploadToIPFS(imgBlob);

const metadata = {
name:`Ritual NFT - @${currentUser}`,
description:"Ritual Genesis Card",
image:imageData.url,
attributes:[
{trait_type:"Type",value:"Genesis"},
{trait_type:"Network",value:"Ritual Testnet"}
]
};

alert("Uploading metadata...");

const metaBlob = new Blob(
[JSON.stringify(metadata)],
{type:"application/json"}
);

const metaData = await uploadToIPFS(metaBlob);

const tokenURI = `https://ipfs.io/ipfs/${metaData.cid}`;

alert("Minting NFT...");

const tx = await contract.mint(address, tokenURI);
await tx.wait();

alert("NFT minted!");

}catch(e){
console.error(e);
alert("Mint failed (check console)");
}

}

generateCard();

</script>

</body>
</html>
