<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ritual NFT Cards</title>

<script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>

<style>
body{
margin:0;
font-family:Arial;
background:#07130d;
color:white;
text-align:center;
}

input,button{
padding:12px;
margin:10px;
border-radius:10px;
border:none;
font-size:16px;
}

button{
cursor:pointer;
}

.green{
background:#22c55e;
color:white;
}

.dark{
background:#14532d;
color:white;
}

canvas{
margin-top:20px;
border-radius:20px;
box-shadow:0 0 30px rgba(34,197,94,.3);
}
</style>
</head>

<body>

<h1>🧬 Ritual NFT Cards</h1>

<input id="username" placeholder="@username">

<br>

<button class="green" onclick="generateCard()">Generate</button>
<button class="dark" onclick="downloadCard()">Download PNG</button>

<br>

<canvas id="card" width="800" height="1000"></canvas>

<br><br>

<button class="green" onclick="connectWallet()">Connect Wallet</button>
<button class="dark" onclick="mintNFT()">Mint NFT</button>

<div id="wallet" style="margin-top:10px;"></div>

<script>

const contractAddress = "0xdB8FF15f6D9c7a35F86542a9052608DF7a16FB8a";

const contractABI = [
  "function mint(address to, string tokenURI)"
];

let currentUser = "ritual";

const canvas = document.getElementById("card");
const ctx = canvas.getContext("2d");

function generateCard(){

const name = document.getElementById("username").value || "unknown";
currentUser = name;

ctx.clearRect(0,0,800,1000);

const g = ctx.createLinearGradient(0,0,800,1000);
g.addColorStop(0,"#06120d");
g.addColorStop(1,"#0f2d18");

ctx.fillStyle = g;
ctx.fillRect(0,0,800,1000);

ctx.strokeStyle="#22c55e";
ctx.lineWidth=10;
ctx.strokeRect(20,20,760,960);

ctx.fillStyle="#4ade80";
ctx.font="bold 50px Arial";
ctx.textAlign="center";
ctx.fillText("RITUAL NFT",400,120);

ctx.fillStyle="white";
ctx.font="40px Arial";
ctx.fillText("@"+name,400,500);

ctx.fillStyle="#9ca3af";
ctx.font="24px Arial";
ctx.fillText("Genesis Ritual Card",400,560);
}

function downloadCard(){
const a=document.createElement("a");
a.download=currentUser+"-ritual.png";
a.href=canvas.toDataURL("image/png");
a.click();
}

async function connectWallet(){

if(!window.ethereum){
alert("Install MetaMask");
return;
}

const accounts = await ethereum.request({ method:"eth_requestAccounts" });

document.getElementById("wallet").innerText =
"Connected: " + accounts[0];
}

async function mintNFT(){

try{

if(!window.ethereum){
alert("MetaMask not found");
return;
}

await ethereum.request({ method:"eth_requestAccounts" });

const provider = new ethers.providers.Web3Provider(window.ethereum);
const signer = provider.getSigner();

const contract = new ethers.Contract(
contractAddress,
contractABI,
signer
);

const address = await signer.getAddress();

const image = canvas.toDataURL("image/png");

const metadata = {
name: "Ritual NFT @"+currentUser,
description: "Generated Ritual NFT",
image: image
};

const tokenURI =
"data:application/json;base64," +
btoa(JSON.stringify(metadata));

console.log("Minting...");

const tx = await contract.mint(address, tokenURI);

await tx.wait();

alert("Mint SUCCESS!");

}catch(e){
console.error(e);
alert("Mint failed — check console");
}

}

generateCard();

</script>

</body>
</html>
