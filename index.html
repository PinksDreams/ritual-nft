```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ritual NFT Cards</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial,sans-serif;
background:#05120b;
color:white;
min-height:100vh;
}

.hero{
padding:60px 20px;
text-align:center;
}

.hero h1{
font-size:52px;
color:#4ade80;
margin-bottom:15px;
}

.hero p{
color:#9ca3af;
font-size:18px;
}

.container{
max-width:1300px;
margin:auto;
padding:20px;
}

.grid{
display:grid;
grid-template-columns:420px 1fr;
gap:40px;
}

.panel{
background:rgba(255,255,255,0.04);
border:1px solid rgba(74,222,128,.15);
border-radius:24px;
padding:30px;
backdrop-filter:blur(12px);
}

.panel h2{
margin-bottom:20px;
color:#4ade80;
}

label{
display:block;
margin-top:20px;
margin-bottom:8px;
}

input{
width:100%;
padding:14px;
border:none;
border-radius:12px;
background:#102117;
color:white;
font-size:16px;
}

select{
width:100%;
padding:14px;
border:none;
border-radius:12px;
background:#102117;
color:white;
font-size:16px;
}

button{
width:100%;
padding:14px;
margin-top:20px;
border:none;
border-radius:12px;
cursor:pointer;
font-size:16px;
font-weight:bold;
}

.generate-btn{
background:#22c55e;
color:white;
}

.generate-btn:hover{
background:#16a34a;
}

.download-btn{
background:#166534;
color:white;
}

.download-btn:hover{
background:#14532d;
}

.preview{
display:flex;
justify-content:center;
align-items:center;
}

canvas{
width:100%;
max-width:550px;
border-radius:20px;

box-shadow:
0 0 30px rgba(34,197,94,.3),
0 0 80px rgba(34,197,94,.15);
}

.avatar-preview{
text-align:center;
margin-top:20px;
}

.avatar-preview img{
width:100px;
height:100px;
border-radius:50%;
border:3px solid #22c55e;
object-fit:cover;
display:none;
}

.mint-box{
margin-top:40px;
background:rgba(255,255,255,0.04);
border:1px solid rgba(74,222,128,.15);
border-radius:24px;
padding:30px;
text-align:center;
}

.mint-box h3{
color:#4ade80;
margin-bottom:15px;
}

.mint-btn{
background:#374151;
color:white;

}

.footer{
margin-top:60px;

}

@media(max-width:900px){

.grid{
grid-template-columns:1fr;
}

.hero h1{
font-size:38px;
}

}

</style>
</head>

<body>

<section class="hero">

<h1>🧬 Ritual NFT Cards</h1>

<p>
Create your Ritual identity card and prepare it for minting.
</p>

</section>

<div class="container">

<div class="grid">

<div class="panel">

<h2>Create Card</h2>

<label>X Username</label>

<input
id="username"
placeholder="@username"
>

<div class="avatar-preview">

<img
id="avatarPreview"
src=""
alt="Avatar Preview"
>

</div>

<label>Style</label>

<select id="style">
<option value="genesis">
Genesis Green
</option>
</select>

<button
class="generate-btn"
onclick="generateCard()"
>
Generate Card
</button>

<button
class="download-btn"
onclick="downloadCard()"
>
Download PNG
</button>

</div>

<div class="panel preview">

<canvas
id="cardCanvas"
width="800"
height="1000">
</canvas>

</div>

</div>

<div class="mint-box">

<h3>Mint NFT</h3>

<p
style="
color:#9ca3af;
margin-bottom:20px;
"
>
Connect your wallet and prepare your Ritual NFT.
</p>

<button
class="generate-btn"
id="connectWalletBtn"
onclick="connectWallet()">
Connect Wallet </button>

<div
id="walletAddress"
style="
margin-top:15px;
color:#4ade80;
font-size:14px;
word-break:break-all;">
</div>

<button
class="download-btn"
id="mintBtn"
disabled>
Mint NFT </button>

</div>


</div>

<div class="footer">
Ritual Genesis Collection
</div>

<script>

const canvas =
document.getElementById("cardCanvas");

const ctx =
canvas.getContext("2d");

let currentUser = "ritual";

function loadImage(src){

return new Promise((resolve,reject)=>{

const img = new Image();

img.crossOrigin = "anonymous";

img.onload = ()=>resolve(img);

img.onerror = reject;

img.src = src;

});

}

document
.getElementById("username")
.addEventListener("input",function(){

const username =
this.value
.replace("@","")
.trim();

const avatar =
document.getElementById(
"avatarPreview"
);

if(username){

avatar.src =
`https://unavatar.io/x/${username}`;

avatar.style.display =
"block";

}else{

avatar.style.display =
"none";

}

});

async function generateCard(){

const usernameInput =
document
.getElementById("username")
.value
.trim();

if(!usernameInput){

alert("Enter username");

return;

}

const username =
usernameInput
.replace("@","");

currentUser = username;

ctx.clearRect(
0,
0,
800,
1000
);

const gradient =
ctx.createLinearGradient(
0,
0,
800,
1000
);

gradient.addColorStop(
0,
"#06120d"
);

gradient.addColorStop(
1,
"#0f2d18"
);

ctx.fillStyle =
gradient;

ctx.fillRect(
0,
0,
800,
1000
);

ctx.strokeStyle =
"#22c55e";

ctx.lineWidth = 8;

ctx.strokeRect(
25,
25,
750,
950
);

ctx.fillStyle =
"#4ade80";

ctx.font =
"bold 50px Arial";

ctx.textAlign =
"center";

ctx.fillText(
"RITUAL CARD",
400,
90
);

try{

const avatar =
await loadImage(
`https://unavatar.io/x/${username}`
);

ctx.save();

ctx.beginPath();

ctx.arc(
400,
300,
130,
0,
Math.PI*2
);

ctx.clip();

ctx.drawImage(
avatar,
270,
170,
260,
260
);

ctx.restore();

}catch(error){

ctx.fillStyle =
"#374151";

ctx.beginPath();

ctx.arc(
400,
300,
130,
0,
Math.PI*2
);

ctx.fill();

}

ctx.strokeStyle =
"#4ade80";

ctx.lineWidth = 6;

ctx.beginPath();

ctx.arc(
400,
300,
130,
0,
Math.PI*2
);

ctx.stroke();

ctx.fillStyle =
"white";

ctx.font =
"bold 42px Arial";

ctx.fillText(
"@" + username,
400,
530
);

ctx.fillStyle =
"#9ca3af";

ctx.font =
"26px Arial";

ctx.fillText(
"Genesis Collection",
400,
580
);

ctx.fillStyle =
"#4ade80";

ctx.font =
"24px Arial";

ctx.fillText(
"Ritual Explorer",
400,
650
);

ctx.strokeStyle =
"rgba(74,222,128,.4)";

ctx.strokeRect(
150,
720,
500,
120
);

ctx.fillStyle =
"#4ade80";

ctx.font =
"22px Arial";

ctx.fillText(
"Status: Active",
400,
790
);

ctx.fillStyle =
"#9ca3af";

ctx.fillText(
"Mint ID: Pending",
400,
830
);

}

function downloadCard(){

const link =
document.createElement("a");

link.download =
currentUser +
"-ritual-card.png";

link.href =
canvas.toDataURL(
"image/png"
);

link.click();

}
async function connectWallet(){

if(!window.ethereum){

alert(
"MetaMask is not installed. Please install MetaMask."
);

return;

}

try{

const accounts =
await window.ethereum.request({
method:"eth_requestAccounts"
});

const address =
accounts[0];

document
.getElementById(
"walletAddress"
).innerText =
"Connected: " + address;

document
.getElementById(
"mintBtn"
).disabled = false;

}
catch(error){

console.error(error);

alert(
"Wallet connection failed."
);

}

}

generateCard();

</script>

</body>
</html>
```
