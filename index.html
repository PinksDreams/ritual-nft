<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ritual NFT Cards</title>

<script src="https://cdn.jsdelivr.net/npm/ethers@6.13.2/dist/ethers.umd.min.js"></script>

<style>
body{
margin:0;
font-family:Arial;
background:#06130c;
color:white;
text-align:center;
}
.title{
margin-top:30px;
color:#b6ff5c;
font-size:56px;
font-weight:900;

text-shadow:
0 0 8px #b6ff5c,
0 0 16px #b6ff5c,
0 0 32px #7CFF3A,
0 0 64px #7CFF3A,
0 0 100px #39ff14;
}
.logo{
position: fixed;
top: 20px;
right: 20px;
width: 320px;
height: 320px;
object-fit: contain;
z-index: 9999;
filter: drop-shadow(0 0 25px rgba(34,197,94,0.8));
}
input,button{
padding:12px;
margin:10px;
border-radius:10px;
border:none;
font-size:16px;
}

button{cursor:pointer}

.green{background:#22c55e;color:white;}
.dark{background:#14532d;color:white;}

canvas{
margin-top:20px;
border-radius:20px;
box-shadow:0 0 30px rgba(34,197,94,.3);
}
</style>
  
</head>

<body>

<img src="logo.png" class="logo">
   
<h1 class="title">Ritual NFT Cards</h1>

<input id="username" placeholder="@username">

<br>

<button class="green" onclick="generateCard()">Generate</button>
<button class="dark" onclick="downloadCard()">Download PNG</button>

<br>

<canvas id="card" width="800" height="1000"></canvas>

<br>

<button class="green" onclick="connectWallet()">Connect Wallet</button>
<button class="dark" onclick="mintNFT()">Mint NFT</button>

<div id="wallet"></div>

<script>

/* =========================
   CONTRACT
========================= */

const contractAddress = "0x280834daDF2f6406F86F91d415B418931aFA6AD9";

const contractABI = [
  "function mint(address to, string tokenURI)"
];

/* =========================
   STABLE AVATAR (NO TWITTER)
========================= */

function getAvatar(username){
  return `https://api.dicebear.com/7.x/identicon/svg?seed=${encodeURIComponent(username)}`;
}

/* =========================
   CANVAS
========================= */

const canvas = document.getElementById("card");
const ctx = canvas.getContext("2d");

let currentUser = "ritual";

/* =========================
   GENERATE CARD
========================= */

async function generateCard(){

const username =
document.getElementById("username")
.value
.replace("@","")
.trim() || "ritual";

currentUser = username;

/* стабильный выбор аватара и фона */

let hash = 0;

for(let i=0;i<username.length;i++){
hash =
username.charCodeAt(i) +
((hash << 5) - hash);
}

hash = Math.abs(hash);

const avatarIndex =
(hash % 18) + 1;

const bgIndex =
(Math.floor(hash / 18) % 9) + 1;

const bgUrl =
`https://pinksdreams.github.io/ritual-nft/bg/bg${bgIndex}.png`;

const avatarUrl =
`https://pinksdreams.github.io/ritual-nft/avatars/avatar${avatarIndex}.png`;

ctx.clearRect(0,0,800,1000);

/* загрузка фона */

const bgImg = new Image();

bgImg.crossOrigin = "anonymous";

bgImg.onload = () => {

ctx.drawImage(
bgImg,
0,
0,
800,
1000
);

/* загрузка персонажа */

const avatarImg = new Image();

avatarImg.crossOrigin = "anonymous";

avatarImg.onload = () => {

/* персонаж почти на всю карточку */

ctx.drawImage(
avatarImg,
80,
80,
640,
640
);

/* затемнение нижней панели */

ctx.fillStyle =
"rgba(0,0,0,0.55)";

ctx.fillRect(
0,
820,
800,
180
);

/* username */

ctx.fillStyle =
"#ffffff";

ctx.textAlign =
"center";

ctx.font =
"bold 42px Arial";

ctx.fillText(
"@" + username,
400,
900
);

/* коллекция */

ctx.fillStyle =
"#4ade80";

ctx.font =
"28px Arial";

ctx.fillText(
"Ritual Genesis",
400,
950
);

};

avatarImg.onerror = () => {

alert(
"Avatar not found:\n" +
avatarUrl
);

};

avatarImg.src = avatarUrl;

};

bgImg.onerror = () => {

alert(
"Background not found:\n" +
bgUrl
);

};

bgImg.src = bgUrl;

}

/* =========================
   DOWNLOAD
========================= */

function downloadCard(){
const a=document.createElement("a");
a.download=currentUser+"-nft.png";
a.href=canvas.toDataURL("image/png");
a.click();
}

/* =========================
   CONNECT WALLET
========================= */

async function connectWallet(){

if(!window.ethereum){
alert("MetaMask not found");
return;
}

const accounts = await ethereum.request({
method:"eth_requestAccounts"
});

document.getElementById("wallet").innerText =
"Connected: " + accounts[0];
}

/* =========================
   MINT (SAFE VERSION)
========================= */

async function mintNFT() {

  try {

    if (!window.ethereum) {
      alert("MetaMask not found");
      return;
    }

    // 👉 open wallet
    await ethereum.request({ method: "eth_requestAccounts" });

    // 👉 detect network
    const chainId = await ethereum.request({ method: "eth_chainId" });

    console.log("Chain:", chainId);

    // 🔥 YOUR RITUAL TESTNET CHAIN ID
    if (chainId !== "0x7bb") {
      alert("Wrong network! Switch to Ritual testnet");
      return;
    }

    // 👉 ethers v6 provider
    const provider = new ethers.BrowserProvider(window.ethereum);
    const signer = await provider.getSigner();

    // 👉 contract
    const contract = new ethers.Contract(
      contractAddress,
      contractABI,
      signer
    );

    const address = await signer.getAddress();

    // 👉 image from canvas
    const image = canvas.toDataURL("image/png");

    // 👉 metadata
    const metadata = {
      name: "Ritual NFT @" + currentUser,
      description: "Ritual NFT Card",
      image: image
    };

    const tokenURI =
      "data:application/json;base64," +
      btoa(JSON.stringify(metadata));

    console.log("Minting...");

    // 👉 mint tx
    const tx = await contract.mint(address, tokenURI, {
      gasLimit: 600000
    });

    await tx.wait();

    alert("Mint SUCCESS!");

  } catch (e) {
    console.error(e);
    alert("Mint failed — check console");
  }

}

/* =========================
   INIT
========================= */

generateCard();

</script>

</body>
</html>
